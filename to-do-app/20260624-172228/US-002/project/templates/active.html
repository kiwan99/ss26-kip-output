<!DOCTYPE html>
<html>
<head>
    <title>Active Tasks</title>
</head>
<body>
    <h1>Active Tasks</h1>
    <ul>
        {% for task in tasks %}
        <li>
            {{ task.description }}
            <form action="{{ url_for('mark_done', task_id=task.id) }}" method="post">
                <button type="submit">Done</button>
            </form>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
