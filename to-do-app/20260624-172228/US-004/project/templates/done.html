<!DOCTYPE html>
<html>
<head>
    <title>Done To-Do Items</title>
    <style>
        .active { background-color: #d4edda; }
        .done { text-decoration: line-through; color: #6c757d; }
    </style>
</head>
<body>
    <h1>Completed To-Do Items</h1>
    <ul>
    {% for item in items %}
        <li class="done">
            {{ item.content }} (Completed at: {{ item.completion_time.strftime('%Y-%m-%d %H:%M') }})
        </li>
    {% endfor %}
    </ul>
    <a href="/">Back to Active Items</a>
</body>
</html>
