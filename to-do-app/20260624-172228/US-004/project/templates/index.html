<!DOCTYPE html>
<html>
<head>
    <title>To-Do App</title>
    <style>
        .active { background-color: #d4edda; }
        .done { text-decoration: line-through; color: #6c757d; }
    </style>
</head>
<body>
    <h1>Active To-Do Items</h1>
    <form action="/add" method="post">
        <input type="text" name="content" required>
        <button type="submit">Add</button>
    </form>
    <ul>
    {% for item in items %}
        <li class="active">
            {{ item.content }}
            <a href="/done/{{ item.id }}">Mark Done</a>
        </li>
    {% endfor %}
    </ul>
    <a href="/done">View Done Items</a>
</body>
</html>
