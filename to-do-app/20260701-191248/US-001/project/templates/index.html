<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
</head>
<body>
    <h1>Active To-Do Items</h1>
    <form method="POST">
        <input type="text" name="todo_item">
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for item in active_items %}
            <li>{{ item }}</li>
        {% endfor %}
    </ul>
</body>
</html>
