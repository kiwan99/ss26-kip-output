<!DOCTYPE html>
<html>
<head>
    <title>Number Sum</title>
</head>
<body>
    <h1>Input Two Numbers</h1>
    <form method="POST">
        <input type="number" name="num1" required>
        <input type="number" name="num2" required>
        <button type="submit">Calculate Sum</button>
    </form>
    {% if sum is not none %}
    <h2>Sum: {{ sum }}</h2>
    {% endif %}
</body>
</html>
